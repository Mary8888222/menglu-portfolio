<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="蒙璐个人项目展示">
  <title>项目展示｜蒙璐个人简历</title>
  <style>
    :root { --paper: #f4f1e9; --ink: #0b0b0b; --red: #d50000; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--paper); font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
    .project-shell { height: 100%; display: grid; grid-template-rows: 58px 1fr; }
    .project-bar {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(120px, 1fr) auto minmax(120px, 1fr);
      align-items: center;
      gap: 16px;
      padding: 0 18px;
      border-bottom: 3px solid var(--ink);
      background: var(--paper);
      box-shadow: 0 5px 0 rgba(0,0,0,.12);
    }
    .back-home, .open-original {
      width: max-content;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 7px 14px;
      border: 2px solid var(--ink);
      color: var(--ink);
      background: #fff;
      text-decoration: none;
      font-weight: 800;
      box-shadow: 3px 3px 0 var(--red);
    }
    .back-home:hover, .back-home:focus-visible, .open-original:hover, .open-original:focus-visible { background: var(--red); color: #fff; outline: none; }
    .project-title { margin: 0; font-size: clamp(16px, 2vw, 22px); white-space: nowrap; }
    .open-original { justify-self: end; font-size: 13px; }
    iframe { width: 100%; height: 100%; border: 0; background: #fff; }
    .load-note { position: fixed; inset: 58px 0 0; z-index: 0; display: grid; place-items: center; color: #635e56; }
    @media (max-width: 640px) {
      .project-shell { grid-template-rows: 54px 1fr; }
      .project-bar { grid-template-columns: auto 1fr; padding: 0 10px; gap: 10px; }
      .project-title { text-align: right; overflow: hidden; text-overflow: ellipsis; }
      .open-original { display: none; }
      .back-home { min-height: 34px; padding: 6px 11px; }
    }
  </style>
</head>
<body>
  <main class="project-shell">
    <header class="project-bar">
      <a class="back-home" href="index.html?skipIntro=1" aria-label="返回个人简历首页">返回首页</a>
      <h1 class="project-title" id="projectTitle">项目展示</h1>
      <a class="open-original" id="openOriginal" href="#" target="_blank" rel="noopener noreferrer">单独打开项目 ↗</a>
    </header>
    <div class="load-note" aria-hidden="true">项目加载中…</div>
    <iframe id="projectFrame" title="项目网站" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </main>
  <script>
    const projects = {
      honglu: { title: '红炉有伴萌宠预约平台', url: 'https://mary8888222.github.io/honglu-youban-booking/' },
      shiguang: { title: '拾光档案网站', url: 'https://mary8888222.github.io/shiguang-archive/' }
    };
    const key = new URLSearchParams(location.search).get('project');
    const project = projects[key];
    if (!project) {
      location.replace('index.html');
    } else {
      document.title = `${project.title}｜蒙璐个人简历`;
      document.querySelector('#projectTitle').textContent = project.title;
      document.querySelector('#openOriginal').href = project.url;
      document.querySelector('#projectFrame').src = project.url;
    }
  </script>
</body>
</html>
